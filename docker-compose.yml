services:
  db:
    image: mysql:8.0
    container_name: mietemu-db
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mietemu-app
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      TZ: Asia/Jakarta
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      # vendor ada di volume Docker (bukan folder Windows): jauh lebih cepat dibaca
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  # Penangkap email untuk development (tidak mengirim email sungguhan)
  mailpit:
    image: axllent/mailpit:latest
    container_name: mietemu-mailpit
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    ports:
      - "8025:8025"   # tampilan web inbox

volumes:
  mysql_data:
  vendor_data: